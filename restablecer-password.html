
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña | Mirá Belgrano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="cambiarPassword" style="max-width:420px; margin:80px auto;">
    <h2>Crear nueva contraseña</h2>

    <p>Ingresá tu nueva contraseña para acceder a Mirá Belgrano.</p>

    <form id="formRestablecerPassword">

      <label for="nuevaPassword">Nueva contraseña</label>
      <input
        type="password"
        id="nuevaPassword"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <label for="confirmarPassword">Confirmar contraseña</label>
      <label class="mostrarPassword">
  <input type="checkbox" id="mostrarPassword">
  Mostrar contraseñas
</label>
      <input
        type="password"
        id="confirmarPassword"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <button type="submit">
        Guardar nueva contraseña
      </button>

      <p id="mensajeRestablecer" aria-live="polite"></p>

    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="restablecer-password.js"></script>

</body>
</html>
