<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crear cuenta | Mirá Belgrano</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="comercioHeader">
    <a href="index.html">
      <img src="logo.png" class="logo" alt="Mirá Belgrano">
    </a>
  </header>

  <main>

    <section class="loginComercio">

      <h1>Crear cuenta</h1>

      <p>Registrate para publicar tu comercio en Mirá Belgrano.</p>

      <form id="registroForm">

        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          required
        >

        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          minlength="6"
          required
        >

        <label for="passwordConfirmar">Repetir contraseña</label>
        <input
          type="password"
          id="passwordConfirmar"
          minlength="6"
          required
        >

        <button type="submit">
          Crear cuenta
        </button>

      </form>

      <p id="registroMensaje"></p>

      <div class="registroAcceso">
        <p>¿Ya tenés una cuenta?</p>

        <a href="login.html" class="btnRegistro">
          Iniciar sesión
        </a>
      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="registro.js"></script>

</body>

</html>
