<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Acceso comercios | Mirá Belgrano</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="comercioHeader">
    <a href="index.html">
      <img src="logo.png" class="logo" alt="Mirá Belgrano">
    </a>
  </header>

  <main>

    <section class="loginComercio">

      <h1>Panel del comercio</h1>

      <p>Ingresá para administrar tu comercio y tus promociones.</p>

      <form id="loginForm">

        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          required
        >

        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          required
        >

        <button type="submit">
          Ingresar
        </button>

      </form>

      <p id="loginMensaje"></p>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="login.js"></script>

</body>

</html>
