<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del comercio | Mirá Belgrano</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="comercioHeader">
    <a href="index.html">
      <img src="logo.png" class="logo" alt="Mirá Belgrano">
    </a>
  </header>

  <main>
    <section class="loginComercio">

      <h1 id="panelTitulo">Cargando...</h1>

      <p id="panelPlan"></p>
      <a href="editar-comercio.html" class="btnEditarComercio">
  Editar datos de mi comercio
</a>
      <div id="panelSuscripcion" class="panelSuscripcion">

  <h2>Mi suscripción</h2>

  <p id="estadoSuscripcion">
    Estado de la suscripción: <strong>Cargando...</strong>
  </p>

  <label for="seleccionarPlan">Elegí tu plan</label>

  <select id="seleccionarPlan">
    <option value="basico">Plan Básico - $8.000/mes</option>
    <option value="auspiciante">Plan Auspiciante - $12.000/mes</option>
  </select>

  <button type="button" id="contratarPlan">
    Contratar plan
  </button>

  <!-- Formulario de pago: se habilitará al completar la integración segura -->
  <div id="formularioPago" style="display: none; margin-top: 20px;">
    <h3>Datos de pago</h3>
    <p>Suscripción mensual mediante Mercado Pago.</p>
    <form id="formTarjeta">
      <div id="mpNumeroTarjeta" style="min-height: 45px;"></div>
      <div id="mpVencimiento" style="min-height: 45px;"></div>
      <div id="mpCodigoSeguridad" style="min-height: 45px;"></div>
      <input type="text" id="mpTitular" placeholder="Nombre del titular" autocomplete="cc-name">
      <select id="mpBanco"></select>
      <select id="mpCuotas"></select>
      <select id="mpDocumentoTipo"></select>
      <input type="text" id="mpDocumentoNumero" placeholder="Número de documento">
      <input type="email" id="mpEmail" placeholder="Correo electrónico" autocomplete="email">
      <button type="submit" id="confirmarSuscripcion">Confirmar suscripción</button>
    </form>
    <p id="mensajePago"></p>
  </div>

</div>

<div id="panelContenido">

  <div class="panelPromociones" id="panelPromociones">
    <h2>Mis promociones</h2>
    <button id="nuevaPromocion" class="btnNuevaPromo">
  + Nueva promoción
</button>
<div id="formPromocion" class="formPromocion" style="display: none;">

  <h3>Nueva promoción</h3>
  <label for="promoImagen">Imagen o video de la promoción</label>

<input
  type="file"
  id="promoImagen"
  accept="image/jpeg,image/png,image/webp,video/mp4"
>

<small class="archivoAyuda">
  JPG, PNG, WEBP o MP4 · Máximo 10 MB
</small>

  <label for="promoTitulo">Título</label>
  <input type="text" id="promoTitulo" placeholder="Ej: 20% de descuento">

  <label for="promoDescripcion">Descripción</label>
  <textarea id="promoDescripcion" placeholder="Contá brevemente la promoción"></textarea>

  <label for="promoInicio">Fecha de inicio</label>
  <input type="date" id="promoInicio">

  <label for="promoFin">Fecha de finalización</label>
  <input type="date" id="promoFin">

  <button type="button" id="publicarPromocion">
    Publicar promoción
  </button>

</div>



    <div id="misPromociones">
        
      Cargando promociones...
    </div>
  </div>

</div>

      <button id="cerrarSesion">
        Cerrar sesión
      </button>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://sdk.mercadopago.com/js/v2"></script>
  <script src="panel.js"></script>

</body>

</html>
