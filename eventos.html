<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const dbEventos = window.supabase.createClient(
  "https://ezyqqnyhsqgpxclpkbzq.supabase.co",
  "sb_publishable_vFfGaVSYjYXXzxvlrAds5A_qxu_Zvk9"
);

function fechaArgentina() {
  const partes = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Argentina/Buenos_Aires",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const valor = tipo =>
    partes.find(parte => parte.type === tipo).value;

  return `${valor("year")}-${valor("month")}-${valor("day")}`;
}

function mostrarFecha(fechaInicio, fechaFin) {
  const convertir = fecha => {
    const [anio, mes, dia] = fecha.split("-").map(Number);
    return new Date(anio, mes - 1, dia).toLocaleDateString("es-AR", {
      day: "numeric",
      month: "long",
      year: "numeric"
    });
  };

  if (fechaInicio === fechaFin) {
    return convertir(fechaInicio);
  }

  return `${convertir(fechaInicio)} al ${convertir(fechaFin)}`;
}

function crearDato(icono, texto) {
  const parrafo = document.createElement("p");

  const iconoElemento = document.createElement("i");
  iconoElemento.className = `fa-solid ${icono}`;
  iconoElemento.style.marginRight = "8px";

  parrafo.append(iconoElemento, document.createTextNode(texto));
  return parrafo;
}

function crearTarjetaEvento(evento) {
  const tarjeta = document.createElement("article");
  tarjeta.className = "turismoCard";

  if (evento.imagen_url) {
    const imagen = document.createElement("img");
    imagen.src = evento.imagen_url;
    imagen.alt = `Afiche de ${evento.titulo}`;
    imagen.loading = "lazy";
    tarjeta.appendChild(imagen);
  }

  const contenido = document.createElement("div");
  contenido.className = "turismoCardContenido";

  const titulo = document.createElement("h2");
  titulo.textContent = evento.titulo;
  contenido.appendChild(titulo);

  contenido.appendChild(
    crearDato(
      "fa-calendar-days",
      mostrarFecha(evento.fecha_inicio, evento.fecha_fin)
    )
  );

  if (evento.horario) {
    contenido.appendChild(
      crearDato("fa-clock", evento.horario)
    );
  }

  if (evento.lugar) {
    contenido.appendChild(
      crearDato("fa-location-dot", evento.lugar)
    );
  }

  if (evento.descripcion) {
    const descripcion = document.createElement("p");
    descripcion.textContent = evento.descripcion;
    contenido.appendChild(descripcion);
  }

  if (evento.enlace) {
    try {
      const url = new URL(evento.enlace);

      if (["https:", "http:"].includes(url.protocol)) {
        const enlace = document.createElement("a");
        enlace.href = url.href;
        enlace.target = "_blank";
        enlace.rel = "noopener noreferrer";
        enlace.appendChild(
          document.createTextNode("Más información →")
        );
        contenido.appendChild(enlace);
      }
    } catch (error) {
      console.warn("Enlace inválido:", evento.enlace);
    }
  }

  tarjeta.appendChild(contenido);
  return tarjeta;
}

async function cargarEventosPublicos() {
  const contenedor = document.getElementById("listaEventos");

  const { data, error } = await dbEventos
    .from("eventos")
    .select("*")
    .gte("fecha_fin", fechaArgentina())
    .order("fecha_inicio", { ascending: true });

  if (error) {
    console.error("Error cargando eventos:", error);
    contenedor.textContent =
      "No pudimos cargar los eventos. Intentá nuevamente más tarde.";
    return;
  }

  contenedor.replaceChildren();

  if (!data || data.length === 0) {
    contenedor.textContent =
      "Por el momento no hay próximos eventos publicados.";
    return;
  }

  data.forEach(evento => {
    contenedor.appendChild(crearTarjetaEvento(evento));
  });
}

cargarEventosPublicos();
</script>



</body>
