
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activar institución | Mirá Belgrano</title>
  <link rel="stylesheet" href="css/activar-institucion.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/activar-institucion.js" defer></script>
</head>
<body>
  <main class="contenedor">
    <div class="tarjeta">
      <div class="marca">💜 Mirá Belgrano</div>

      <h1>Bienvenido a Belgrano Solidario</h1>
      <p class="introduccion">
        Activá tu institución para compartir historias,
        administrar sus actividades y mantener
        actualizada su información.
      </p>

      <form id="formRegistro">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          autocomplete="email"
          required
        >

        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <button type="submit" id="btnRegistro">
          Crear mi cuenta
        </button>
        <button type="button" id="btnIniciarSesion">
          Ya tengo cuenta: iniciar sesión
        </button>
      </form>

      <p id="mensaje" role="status" aria-live="polite"></p>

      <div class="acceso">
        ¿Ya confirmaste tu correo?
        <button type="button" id="btnActivar">
          Activar mi institución
        </button>
      </div>
    </div>
  </main>
</body>
</html>
